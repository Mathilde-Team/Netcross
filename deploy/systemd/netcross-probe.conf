# Configuration de l'unité systemd netcross-probe (issue #1107).
#
# Copiez ce fichier dans /etc/netcross-probe/netcross-probe.conf et
# adaptez-le (droits 600, root:root -- il peut contenir un jeton
# d'enrôlement à usage unique, utile seulement au premier lancement :
# retirez la ligne NETCROSS_PROBE_JETON une fois la sonde inscrite).

# Interface à capturer sur cette sonde (obligatoire)
NETCROSS_PROBE_INTERFACE=eth0

# Nom de la sonde déclaré au collecteur (obligatoire)
NETCROSS_PROBE_NOM=routeur-besancon

# Écoute mTLS du contrat v1 (port 9443 par défaut)
NETCROSS_PROBE_ECOUTE=0.0.0.0:9443

# Premier lancement seulement : URL d'enrôlement du collecteur + jeton à
# usage unique (voir docs/deploiement-sonde.md). Laissez vide ensuite.
NETCROSS_PROBE_ENROLEMENT=
NETCROSS_PROBE_JETON=

# Adresse https:// annoncée au collecteur (déduite de --ecoute si l'hôte
# n'est pas 0.0.0.0) : sans elle, la sonde est inscrite mais non
# interrogeable en direct (409 probe_address_unknown).
NETCROSS_PROBE_LISTEN_URL=https://sonde.lan:9443

# Tampon circulaire : profondeur (fichiers) et durée par fichier (s)
NETCROSS_PROBE_NB_FICHIERS=10
NETCROSS_PROBE_DUREE_PAR_FICHIER=60
