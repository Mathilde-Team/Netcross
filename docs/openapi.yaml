components:
  schemas:
    AnalysisAccepted:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          default: pending
        status_url:
          type: string
          title: Status Url
          description: Route à interroger jusqu'à completed/failed
      type: object
      required:
      - analysis_id
      - status_url
      title: AnalysisAccepted
      description: 'Réponse 202 des uploads : analyse enregistrée, en tâche de fond
        (#356).'
    AnalysisStatus:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          description: pending, completed ou failed
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Cause de l'échec (status failed)
        summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Summary
          description: Résumé (compteurs, et points/segments en multi-points) une
            fois completed
      type: object
      required:
      - analysis_id
      - status
      title: AnalysisStatus
      description: 'Statut d''une analyse pour GET /analyses/{id}/status (issue #356).'
    AnalysisSummary:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          default: completed
        point_count:
          type: integer
          title: Point Count
          default: 0
        packet_count:
          type: integer
          title: Packet Count
          default: 0
        security_finding_count:
          type: integer
          title: Security Finding Count
          default: 0
        history_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: History Id
          description: 'Id du run dans l''historique (history=true, #890)'
        history_error:
          anyOf:
          - type: string
          - type: 'null'
          title: History Error
          description: Enregistrement dans l'historique impossible (l'analyse reste
            valable)
      type: object
      required:
      - analysis_id
      title: AnalysisSummary
      description: Résumé d'une analyse (retourné par POST /captures).
    AnnotationBody:
      properties:
        point:
          type: string
          title: Point
          description: Point de capture annoté (un des points de l'analyse)
        frame_number:
          type: integer
          title: Frame Number
          description: Numéro de trame (>= 1, celui de Wireshark)
        tag:
          type: string
          title: Tag
          description: Étiquette
        comment:
          type: string
          title: Comment
          description: Commentaire libre
          default: ''
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
          description: 'Couleur d''affichage (ex. #ff0000)'
      type: object
      required:
      - point
      - frame_number
      - tag
      title: AnnotationBody
      description: Corps de ``POST /analyses/{analysis_id}/annotations``.
    BPFFilterBody:
      properties:
        expression:
          type: string
          title: Expression
          description: Expression BPF (libpcap), transmise telle quelle à tshark (-f)
        description:
          type: string
          title: Description
          description: Description libre, facultative
          default: ''
      type: object
      required:
      - expression
      title: BPFFilterBody
      description: Corps de ``PUT /bpf-filters/{nom}``.
    Body_adjust_time_route_tools_adjust_time_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Capture à recaler
        time_offset:
          anyOf:
          - type: number
          - type: 'null'
          title: Time Offset
          description: Décalage en secondes (équivalent de --time-offset)
        normalize:
          type: boolean
          title: Normalize
          description: Premier paquet à t=0 (équivalent de --normalize-time)
          default: false
        align_to:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Align To
          description: Capture de référence (équivalent de --align-to)
        format:
          type: string
          title: Format
          description: 'Format de sortie : pcapng ou pcap'
          default: pcapng
      type: object
      required:
      - file
      title: Body_adjust_time_route_tools_adjust_time_post
    Body_convert_capture_route_tools_convert_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Capture à convertir
        format:
          type: string
          title: Format
          description: pcap, pcapng, erf, csv ou json (équivalent de --convert-format)
          default: pcapng
      type: object
      required:
      - file
      title: Body_convert_capture_route_tools_convert_post
    Body_create_batch_batches_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Captures du lot (.pcap, .pcapng, .cap, .erf, .gz) ou une archive
            .zip (extraite à plat, sous-dossiers compris, comme --recursive)
        no_group:
          type: boolean
          title: No Group
          description: Aucun regroupement (équiv. --no-group)
          default: false
        group_window:
          anyOf:
          - type: number
          - type: 'null'
          title: Group Window
          description: Décalage d'horloge maximal toléré, en secondes (équiv. --group-window)
        min_overlap:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Overlap
          description: Recouvrement temporel minimal, ]0, 1] (équiv. --min-overlap)
        min_common_ips:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Common Ips
          description: IP communes minimales (équiv. --min-common-ips)
        jobs:
          type: integer
          title: Jobs
          description: Captures inventoriées en parallèle (équiv. --jobs)
          default: 1
        security_report:
          type: boolean
          title: Security Report
          description: Analyse de sécurité dans chaque rapport (équiv. --security-report)
          default: false
      type: object
      required:
      - files
      title: Body_create_batch_batches_post
    Body_create_comparison_comparisons_post:
      properties:
        baseline_files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Baseline Files
          description: Fichiers pcap baseline
        current_files:
          anyOf:
          - items:
              type: string
              contentMediaType: application/octet-stream
            type: array
          - type: 'null'
          title: Current Files
          description: Fichiers pcap courant (ou current_live)
        baseline_labels:
          type: string
          title: Baseline Labels
          description: Étiquettes baseline (séparées par virgule)
          default: ''
        current_labels:
          type: string
          title: Current Labels
          description: Étiquettes courant (séparées par virgule)
          default: ''
        points_order:
          type: string
          title: Points Order
          description: 'Ordre des points séparé par virgule (ex: lan,wan,dc)'
          default: ''
        nat_tolerant:
          type: boolean
          title: Nat Tolerant
          description: 'true : corrélation tolérante au NAT (équivalent de --nat-tolerant)'
          default: false
        nat_window_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Nat Window Ms
          description: Fenêtre de corrélation NAT en ms, avec nat_tolerant (équivalent
            de --nat-window-ms)
          default: 200.0
        tls:
          type: boolean
          title: Tls
          description: 'true : diagnostic TLS (équivalent de --tls)'
          default: false
        quic:
          type: boolean
          title: Quic
          description: 'true : diagnostic QUIC/HTTP3 (équivalent de --quic)'
          default: false
        redact:
          type: boolean
          title: Redact
          description: 'true : anonymise les adresses IP/MAC avant analyse (équivalent
            de --redact) ; incompatible avec tls/quic, et le rapport de sécurité n''est
            alors pas calculé'
          default: false
        loss_threshold_pp:
          type: number
          exclusiveMinimum: 0.0
          title: Loss Threshold Pp
          description: 'Seuil d''écart de pertes en points de % (défaut: 2.0)'
          default: 2.0
        latency_threshold_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Latency Threshold Ms
          description: 'Seuil d''écart de latence en ms (défaut: 5.0)'
          default: 5.0
        triage_top_n:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Triage Top N
          description: 'Nombre de segments au triage (défaut: 5)'
          default: 5
        history:
          type: boolean
          title: History
          description: 'true : enregistre la comparaison dans l''historique du serveur
            (NETCROSS_HISTORY_DB), équivalent de --history-db (issue #874)'
          default: false
        history_label:
          anyOf:
          - type: string
          - type: 'null'
          title: History Label
          description: Étiquette du run dans l'historique (équivalent de --history-label)
        current_live:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Live
          description: 'Courant capturé en direct au lieu de current_files (équiv.
            --live-current, issue #908) : JSON de POST /live-captures sans options,
            ex. {"points": [{"name": "LAN", "interface": "eth0"}], "duration": 60}
            ; sans tls/quic ni wait'
      type: object
      required:
      - baseline_files
      title: Body_create_comparison_comparisons_post
    Body_export_subset_route_tools_export_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Capture source
        bpf:
          anyOf:
          - type: string
          - type: 'null'
          title: Bpf
          description: Filtre d'affichage Wireshark (équivalent de --export-bpf)
        time_start:
          anyOf:
          - type: number
          - type: 'null'
          title: Time Start
          description: Début, secondes après le 1er paquet (--export-time-start)
        time_end:
          anyOf:
          - type: number
          - type: 'null'
          title: Time End
          description: Fin, secondes après le 1er paquet (--export-time-end)
        endpoints:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoints
          description: IP1,IP2,... en source ou destination (--export-endpoints)
        format:
          type: string
          title: Format
          description: 'Format de sortie : pcapng ou pcap'
          default: pcapng
      type: object
      required:
      - file
      title: Body_export_subset_route_tools_export_post
    Body_extract_contents_analyses__analysis_id__extract_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Fichiers pcap a extraire
        labels:
          type: string
          title: Labels
          description: Etiquettes separees par virgule
          default: ''
        kinds:
          type: string
          title: Kinds
          description: 'Types: audio,video,documents'
          default: ''
      type: object
      required:
      - files
      title: Body_extract_contents_analyses__analysis_id__extract_post
    Body_merge_captures_route_tools_merge_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Captures à fusionner (pcap/pcapng, formats mélangeables)
        dedup:
          type: boolean
          title: Dedup
          description: Supprimer les paquets identiques (équivalent de --merge-dedup)
          default: false
        format:
          type: string
          title: Format
          description: 'Format de sortie : pcapng (défaut de mergecap) ou pcap'
          default: pcapng
      type: object
      required:
      - files
      title: Body_merge_captures_route_tools_merge_post
    Body_netflow_summary_analyses__analysis_id__netflow_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Fichiers NetFlow v5
        exporters:
          type: string
          title: Exporters
          description: 'Exportateurs: NOM=FICHIER ou FICHIER'
          default: ''
        top:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Top
          description: Taille des classements
          default: 10
      type: object
      required:
      - files
      title: Body_netflow_summary_analyses__analysis_id__netflow_post
    Body_replay_capture_route_tools_replay_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Capture à rejouer
        interface:
          type: string
          title: Interface
          description: Interface d'émission (équivalent de --replay)
        speed:
          type: string
          title: Speed
          description: Multiplicateur ou topspeed (équivalent de --replay-speed)
          default: '1.0'
        loop:
          type: integer
          title: Loop
          description: Nombre de passes, >= 1 (équivalent de --replay-loop)
          default: 1
      type: object
      required:
      - file
      - interface
      title: Body_replay_capture_route_tools_replay_post
    Body_run_analysis_ai_analyses__analysis_id__ai_post:
      properties:
        baseline:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Baseline
          description: Baseline JSON de référence pour la détection d'anomalies (équiv.
            --ai-anomalies)
        baseline_base:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Baseline Base
          description: Baseline JSON existante à enrichir avec baseline_save (équiv.
