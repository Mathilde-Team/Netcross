      type: object
      required:
      - file
      - split
      title: Body_split_capture_route_tools_split_post
    Body_upload_capture_captures_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Fichier pcap/pcapng à analyser
        label:
          type: string
          title: Label
          description: 'Étiquette du point de capture (ex: lan)'
