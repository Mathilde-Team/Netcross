        training:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Training
          description: Jeu d'entraînement JSON étiqueté pour la classification (équiv.
            --ai-classify)
        baseline_save:
          type: boolean
          title: Baseline Save
          description: 'true : renvoie la baseline construite sur les flux de cette
