openapi: 3.1.0
info:
  title: Netcross API
  description: Analyse croisée de captures réseau — service REST
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Health check du service.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /captures:
    post:
      tags:
      - captures
      summary: Upload Capture
      description: 'Upload d''un fichier pcap, analyse en tâche de fond.


        Réponse 202 ``{"status": "pending"}`` : suivre ``status_url`` jusqu''à

        ``completed`` (ou ``failed`` avec ``error``). ``?wait=true`` attend la

        fin et retourne directement le résumé (201). ``nat_tolerant``,

        ``nat_window_ms``, ``tls``, ``quic`` et ``redact`` ont le sens des

        options de même nom de la CLI (issue #330).


        Issue #672 : ``max_packets``, ``sample``, ``test_net_external``, ``names``,

        ``known_destinations`` et ``known_hosts`` sont les équivalents des options

        CLI de même nom (fichiers joints pour les trois derniers).


        Issue #671 : ``extra_files`` permet d''envoyer plusieurs fichiers pour le

        même point (rotation, concaténation chronologique comme ``--capture

        NOM=a,b``). ``split_interfaces`` sépare les interfaces d''un pcapng

        multi-interfaces en points distincts (équiv. ``--split-interfaces``).


        Issue #330 (suite) : ``bucket_ms``, ``rtp_clock_rate``, ``idle_timeout_seconds``,

        ``detect_duplicates``, ``exclude_duplicates`` et ``duplicate_threshold_ms``

        sont les équivalents des options de même nom de la CLI.'
      operationId: upload_capture_captures_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
            de 202 + statut pending'
          default: false
          title: Wait
        description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
          de 202 + statut pending'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_capture_captures_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '201':
          description: Analyse terminée (?wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /captures/multi:
    post:
      tags:
      - captures
      summary: Upload Multi Capture
      description: 'Upload de plusieurs captures étiquetées, analyse croisée entre
        points.


        Issue #354 : équivalent de ``netcross -f LAN=lan.pcap -f DC=dc.pcap

        --order LAN,DC``. ``labels`` donne une étiquette par fichier (dans

        l''ordre des fichiers) ; ``points_order`` (facultatif) fixe l''ordre

        amont -> aval, sinon il est déduit du trafic. Le résumé (``?wait=true``

        ou ``/status``) détaille les pertes et le délai de chaque segment.

        Options d''analyse : comme ``POST /captures`` (issue #330, #672).


        Issue #474 lot 2 : avec ``split_interfaces=true``, un seul fichier est

        accepté (pcapng multi-interfaces) ; ``points_order`` cite alors les

        étiquettes ``ETIQUETTE:INTERFACE`` et est validé après la séparation.


        Issue #671 : ``split_interfaces`` sépare les interfaces d''un pcapng

        multi-interfaces en points distincts (équiv. ``--split-interfaces``).

        Les étiquettes dupliquées sont autorisées : les fichiers portant le

        même label sont concaténés dans l''ordre chronologique (rotation),

        comme ``--capture NOM=a,b`` en CLI.'
      operationId: upload_multi_capture_captures_multi_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
            de 202 + statut pending'
          default: false
          title: Wait
        description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
          de 202 + statut pending'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_multi_capture_captures_multi_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '201':
          description: Analyse terminée (?wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiAnalysisSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}:
    get:
      tags:
      - analyses
      summary: Get Analysis
      description: 'Récupère le rapport complet d''une analyse terminée (JSON).


        Les clés par segment sont « amont -> aval » (voir ``store.jsonable``).'
      operationId: get_analysis_analyses__analysis_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/report:
    get:
      tags:
      - analyses
      summary: Get Analysis Report
      description: 'Rapport structuré d''une analyse terminée : le même document que

        ``netcross --json-report --security-report`` et que l''export JSON de la

        GUI (``findings``, ``triage``, ``health_score``, ``security_report``...).


        Issue #330 : ``GET /analyses/{analysis_id}`` sert la copie brute des

        mesures ; cette route sert les constats et le score de santé. 409 pour

        une analyse enregistrée avant l''ajout de cette route (à relancer).'
      operationId: get_analysis_report_analyses__analysis_id__report_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/security:
    get:
      tags:
      - analyses
      summary: Get Security Report
      description: Récupère les constats de sécurité d'une analyse terminée.
      operationId: get_security_report_analyses__analysis_id__security_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReport'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/text:
    get:
      tags:
      - analyses
      summary: Get Analysis Text
      description: 'Rapport texte d''une analyse terminée (équivalent de la sortie
        console

        de la CLI, issue #670).


        409 si l''analyse a été relue depuis SQLite après un redémarrage

        (les objets vivants nécessaires ne sont pas persistés).'
      operationId: get_analysis_text_analyses__analysis_id__text_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/plain: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/markdown:
    get:
      tags:
      - analyses
      summary: Get Analysis Markdown
      description: 'Rapport Markdown d''une analyse terminée (équivalent de ``--md-report``,

        issue #864) : rapport, constats, TLS/QUIC, sécurité, objets de session et,

        si l''analyse l''avait demandé, moteur de règles.


        409 si l''analyse a été relue depuis SQLite après un redémarrage.'
      operationId: get_analysis_markdown_analyses__analysis_id__markdown_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/markdown: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/pdf:
    get:
      tags:
      - analyses
      summary: Get Analysis Pdf
      description: 'Rapport PDF d''une analyse terminée (équivalent de ``--pdf-report``,

        issue #670).


        ``topn`` contrôle le nombre de catégories affichées par graphique

        temporel Top-N (équivalent de ``--topn-charts``, défaut 5).


        409 si l''analyse a été relue depuis SQLite après un redémarrage.'
      operationId: get_analysis_pdf_analyses__analysis_id__pdf_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: topn
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Nombre de catégories par graphique Top-N
          default: 5
          title: Topn
        description: Nombre de catégories par graphique Top-N
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            application/pdf: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/detail.csv:
    get:
      tags:
      - analyses
      summary: Get Analysis Csv
      description: 'CSV du détail par flux d''une analyse terminée (équivalent de

        ``--detail-csv``, issue #670).


        409 si l''analyse a été relue depuis SQLite après un redémarrage.'
      operationId: get_analysis_csv_analyses__analysis_id__detail_csv_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/csv: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/sequence:
    get:
      tags:
      - analyses
      summary: Get Analysis Sequence
      description: 'Diagramme de séquence des flux les plus volumineux (équiv. --sequence-diagram).


        Retourne une liste de vues de séquence au format JSON, chacune

        contenant les étapes (paquets) d''un flux triées chronologiquement.'
      operationId: get_analysis_sequence_analyses__analysis_id__sequence_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: max_flows
        in: query
        required: false
        schema:
          type: integer
          description: Nombre maximum de flux à représenter
          default: 1
          title: Max Flows
        description: Nombre maximum de flux à représenter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/comm-map:
    get:
      tags:
      - analyses
      summary: Get Analysis Comm Map
      description: 'Cartographie des communications (équiv. ``--comm-map``, vue GUI
        « Cartographie », issue #909).'
      operationId: get_analysis_comm_map_analyses__analysis_id__comm_map_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: protocol
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Seulement ces protocoles (répétable ou séparés par des virgules)
          title: Protocol
        description: Seulement ces protocoles (répétable ou séparés par des virgules)
      - name: top_n
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 'N arêtes les plus volumineuses (défaut : toutes)'
          title: Top N
        description: 'N arêtes les plus volumineuses (défaut : toutes)'
      - name: anomalies_only
        in: query
        required: false
        schema:
          type: boolean
          description: Seulement les arêtes avec anomalies
          default: false
          title: Anomalies Only
        description: Seulement les arêtes avec anomalies
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: json ou dot (Graphviz, anomalies en rouge)
          default: json
          title: Format
        description: json ou dot (Graphviz, anomalies en rouge)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/stats:
    get:
      tags:
      - analyses
      summary: Get Analysis Stats
      description: 'Exploration statistique (équiv. ``--stats``, vue GUI « Exploration
        statistique », issue #912).


        Chaque ligne porte ``flow_keys`` : les clés des flux regroupés (drill-down).'
      operationId: get_analysis_stats_analyses__analysis_id__stats_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          description: endpoint, protocol, segment ou flow
          default: endpoint
          title: Group By
        description: endpoint, protocol, segment ou flow
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: packets, bytes, duration_ms, throughput_bps, latency_ms ou
            events
          default: bytes
          title: Sort
        description: packets, bytes, duration_ms, throughput_bps, latency_ms ou events
      - name: top_n
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: N premières lignes (0 = toutes)
          default: 10
          title: Top N
        description: N premières lignes (0 = toutes)
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: json ou csv
          default: json
          title: Format
        description: json ou csv
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/csv: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/dashboard:
    get:
      tags:
      - analyses
      summary: Get Analysis Dashboard
      description: 'Agrégats croisés du dashboard (équiv. ``--dashboard``, vue GUI
        « Dashboard », issue #911) :

        timeline, segments, flux, endpoints, protocoles et événements, filtrés comme
        une sélection GUI.'
      operationId: get_analysis_dashboard_analyses__analysis_id__dashboard_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: segment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtre sur un point de capture
          title: Segment
        description: Filtre sur un point de capture
      - name: host
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtre sur une adresse d'endpoint
          title: Host
        description: Filtre sur une adresse d'endpoint
      - name: protocol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtre sur un protocole (ex. TCP)
          title: Protocol
        description: Filtre sur un protocole (ex. TCP)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/siem:
    get:
      tags:
      - analyses
      summary: Get Analysis Siem
      description: 'Export SIEM des constats de sécurité (équiv. --siem-export).


        Retourne l''export au format demandé (CEF, LEEF ou STIX) en texte brut.'
      operationId: get_analysis_siem_analyses__analysis_id__siem_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: 'Format d''export SIEM : cef, leef ou stix'
          default: cef
          title: Format
        description: 'Format d''export SIEM : cef, leef ou stix'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/search:
