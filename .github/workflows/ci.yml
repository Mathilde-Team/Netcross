name: CI

# Issue #463 : concentration des workflows. Anciennement trois workflows
# parallèles (ci.yml, docs.yml, i18n.yml) se déclenchaient sur les mêmes
# push/PR vers main/dev. Ils sont fusionnés ici en un seul, réduisant le
# nombre de runs simultanés et le temps d'attente des checks requis.
#
# Jobs :
#   quality     — lint, format, import-linter, tests (check requis)
#   gtk4        — tests GTK4 sous Xvfb (check requis)
#   packaging   — construction + test de fumée deb/rpm (check requis)
#   types       — mypy (non bloquant, continue-on-error)
#   documentation — mkdocs build --strict (check requis, ex docs.yml)
#   i18n        — catalogues gettext à jour et valides (ex i18n.yml check)

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Dans un conteneur, le shell par défaut des étapes run est sh (dash) :
# les scripts du workflow utilisent des tableaux bash (i18n) -> bash imposé.
# Issue #966 : un nouveau commit sur une PR annule le run du commit précédent
# (inutile, et il occupait l'unique runner docker). Les runs push sur dev/main
# ne sont jamais annulés ; event_name sépare le push de dev du relais dev → main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Jobs en conteneur (quality, gtk4, packaging, i18n) : label « docker » exigé.
  # Il désigne un runner maison qui lance les conteneurs sur son propre hôte
  # (VM `ubuntu`). Un runner lui-même conteneurisé (RunnerMaison-2) monte
  # /__w à un autre chemin que l'hôte Docker : « /__w/_temp/…sh: No such file
  # or directory » (#848, #936). Repli inchangé : NETCROSS_RUNS_ON.
  quality:
    name: Qualité (lint, format, import-linter, tests)
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON || '{"group":"maison","labels":["self-hosted","linux","docker"]}') }}
    container:
      image: ubuntu:26.04
      options: --privileged

    steps:
      - name: Prérequis du conteneur (git, certificats, compilateur)
        # ubuntu:26.04 est une image minimale : ni git (checkout et diff i18n),
        # ni certificats, ni gcc (roues pygobject/pycairo compilées localement),
        # ni python3 (scripts du dépôt), ni sudo (scripts/smoke-test-packages.sh).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl build-essential sudo python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de Wireshark CLI (tshark, editcap, capinfos) et de pdftotext
        # Issue #262 : tshark n'était installé dans AUCUN environnement de
        # développement du projet, donc toute la suite @requires_tshark /
        # @requires_editcap était systématiquement sautée. Deux bugs réels
        # (#261 filtre inutilisable, #262 format de sortie ignoré) ont ainsi
        # survécu des mois à une CI verte. Les installer ici rend ces tests
        # exécutables : c'est la seule correction qui empêche la classe entière
        # de régressions de redevenir invisible.
        # DEBIAN_FRONTEND + preseed : l'installeur de wireshark-common pose
        # sinon une question interactive sur les droits de capture.
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark poppler-utils gettext
          tshark --version 2>&1 | sed -n 1p
          editcap --version 2>&1 | sed -n 1p
          # poppler-utils fournit pdftotext, utilise par tests/test_security_outputs.py
          # (issue #218) pour REEXTRAIRE le texte du PDF produit au lieu de
          # s'arreter avant le rendu. C'est precisement le niveau de
          # verification qui manquait a l'issue #259 : un champ present dans
          # les donnees et absent du rendu final. Meme raisonnement que
          # tshark ci-dessus (#262) -- sauter ces tests quand l'outil manque
          # rendrait la CI verte en supprimant la seule verification qui
          # regarde le fichier livre a l'utilisateur.
          pdftotext -v 2>&1 | sed -n 1p

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install 3.14

      - name: Installation des dépendances (extras dev + api + ai)
        run: uv sync --extra dev --extra api --extra ai

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatage (ruff format --check)
        run: uv run ruff format --check .

      - name: Architecture en couches (import-linter)
        run: uv run lint-imports
        env:
          PYTHONPATH: src

      - name: Diagramme de classes à jour (issue #140)
        # Vérifie que docs/class-diagram.md correspond au code source de src/.
        # Le hook pre-commit `class-diagram` le fait en local, mais CI est le
        # filet de sécurité pour les contributions qui n'ont pas lancé le hook.
        run: python3 scripts/generate_class_diagram.py --check

      - name: Spécification OpenAPI à jour (issue #209)
        # Même filet de sécurité que le diagramme de classes ci-dessus :
        # docs/openapi.yaml est dérivé du code de netcross_api, il doit donc
        # être régénéré et commité dès qu'une route ou un modèle change.
        env:
          PYTHONPATH: src
        run: uv run python scripts/generate_openapi.py --check

      - name: Tests (pytest + couverture)
        # --cov sans chemin : source lue depuis [tool.coverage.run] (source =
        # ["src"]) dans pyproject.toml. term-missing dans les logs CI,
        # coverage.xml publie comme artifact (issue #224). Seuil bloquant :
        # fail_under dans [tool.coverage.report] (issue #246), l'etape echoue
        # si la couverture passe dessous.
        # Issue #953 : netcross_gtk4 ne s'exécute pas ici (pas de PyGObject),
        # il est mesuré par le job GTK4 et compté dans le total combiné. Le
        # seuil est donc appliqué hors GUI (--omit au rapport seulement : le
        # fichier .coverage reste complet pour « coverage combine »).
        env:
          COUV_HORS_GUI: "src/netcross_gtk4/*"
        run: |
          uv run pytest --cov --cov-fail-under=0 --cov-report=xml
          uv run coverage report --show-missing --omit="$COUV_HORS_GUI"

      - name: Aucun test sauté silencieusement (issues #261/#262)
        # Trace le nombre de tests sautés et échoue si la suite @requires_tshark
        # l'est encore : un test sauté est une vérification qui n'a pas eu lieu,
        # et le rapport doit le dire plutôt que de le laisser passer pour un
        # succès (règle de traçabilité du projet).
        run: |
          set -o pipefail
          uv run pytest -q -rs --no-header \
            tests/test_export_filtered.py tests/test_adjust_timestamps.py \
            tests/test_split_by_interface.py \
            | tee /tmp/reel.txt
          if grep -q "tshark non installe\|editcap non installe" /tmp/reel.txt; then
            echo "::error::des tests exigeant tshark/editcap ont été sautés alors que CI les installe"
            exit 1
          fi
          echo "tests réels tshark/editcap : tous exécutés"

      - name: Vérification réelle du contenu des PDF (pdftotext non sauté)
        # Issue #218 : les tests de la section de sécurité du PDF réextraient
        # le texte du fichier produit. Sans ce garde-fou, une disparition de
        # poppler-utils de l'image CI rendrait ces tests « sautés » et la CI
        # resterait verte en ayant perdu la seule vérification qui regarde le
        # fichier livré à l'utilisateur.
        run: |
          set -o pipefail
          uv run pytest -q -rs --no-header tests/test_security_outputs.py | tee /tmp/pdf.txt
          if grep -q "pdftotext non installe" /tmp/pdf.txt; then
            echo "::error::des tests vérifiant le contenu des PDF ont été sautés alors que CI installe poppler-utils"
            exit 1
          fi
          echo "tests réels pdftotext : tous exécutés"

      - name: Publication du rapport de couverture (artifact)
        # coverage.xml (format Cobertura) produit par l'etape pytest --cov ;
        # conserve 14 jours, temps de telechargement court.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publication des données de couverture brutes (artifact)
        # Issue #943 : le fichier de données coverage.py (.coverage) est
        # renommé et publié pour le job « Couverture combinée », qui
        # fusionne la mesure de ce job avec celle du job GTK4 : sans lui,
        # les modules netcross_gtk4 comptent pour 0 % dans le total de la
        # CI alors que leurs tests tournent (et couvrent) dans l'autre job.
        # Renommage : les deux jobs publient chacun un « .coverage », les
        # noms distincts évitent la collision au téléchargement — et sans
        # point initial : upload-artifact exclut les fichiers cachés
        # depuis la v4.4.0 (premier passage : « No files were found »
        # malgré le cp réussi ; include-hidden-files: true existerait mais
        # ne sert qu'à ça, le renommage est plus simple).
        if: always()
        run: cp .coverage coverage-qualite.dat || { echo "::warning::.coverage absent (mesure non exécutée)"; exit 0; }
      - name: Upload des données de couverture brutes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-qualite
          path: coverage-qualite.dat
          retention-days: 14
          if-no-files-found: warn

      - name: Restituer le workspace au runner (chown)
        # Ce job en conteneur tourne en root : sans restitution, il laisse
        # dans les répertoires partagés du runner (workspace ET $RUNNER_TEMP,
        # partagés entre les jobs d'un runner auto-hébergé) des fichiers
        # détenus par root — artefacts build-rpm/_build, .git recréés, venv
        # — que les jobs natifs (Types, Construction, Couverture par PR,
        # Protection des branches) ne peuvent ni lire ni nettoyer : checkout
        # en EACCES « .git/FETCH_HEAD », venv uv non remplaçable (constat
        # 22/10/2026, #919/#936, symptômes isolés par #958).
        # --reference : chaque répertoire appartient au compte du runner.
        if: always()
        run: |
          chown -R --reference="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          chown -R --reference="$RUNNER_TEMP" "$RUNNER_TEMP"

  gtk4:
    # Tests GTK4 réellement exécutés (issues #357, #363, #421).
    # Le job Qualité n'installe ni pygobject ni libgtk-4 : tous les tests
    # pilotés via pygobject y sont SAUTÉS -- c'est voulu (#285/#421 : aucun
    # test n'exige GTK4 dans ce job). Mais un test sauté est une vérification
    # qui n'a pas eu lieu (#261/#262) : sans ce job, les ~180 tests des lots
    # de #421 ne tourneraient jamais en CI et pourraient régresser
    # indéfiniment sous une CI verte (un test du lot 7 échouait déjà sous
    # GTK4 tout en passant en CI). Ici : GTK4 + pygobject + serveur X
    # virtuel (Xvfb), suite complète, et échec si un test GTK est sauté.
    name: Tests GTK4 (Xvfb)
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON || '{"group":"maison","labels":["self-hosted","linux","docker"]}') }}
    container:
      image: ubuntu:26.04
      options: --privileged

    steps:
      - name: Prérequis du conteneur (git, certificats, compilateur)
        # ubuntu:26.04 est une image minimale : ni git (checkout et diff i18n),
        # ni certificats, ni gcc (roues pygobject/pycairo compilées localement),
        # ni python3 (scripts du dépôt), ni sudo (scripts/smoke-test-packages.sh).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl build-essential sudo python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: GTK4, introspection, Xvfb, tshark, pdftotext
        # libgirepository-2.0-dev + libcairo2-dev : compilation de
        # pygobject/pycairo depuis les sources si aucune roue ne convient.
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gir1.2-gtk-4.0 libgirepository-2.0-dev libcairo2-dev pkg-config \
            xvfb xauth tshark poppler-utils gettext

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install 3.14

      - name: Installation des dépendances (extras dev + api + ai, pygobject)
        # pygobject n'est pas une dépendance du projet (la GUI utilise celui
        # du système via le paquet) : installé ici dans le venv de test.
        run: |
          uv sync --extra dev --extra api --extra ai
          uv pip install pygobject pycairo

      - name: Tests sous Xvfb, aucun test GTK sauté
        # Motifs de saut : tests/gtk4_display.py. -p no:cacheprovider :
        # rien à conserver entre deux exécutions de ce job.
        run: |
          set -o pipefail
          xvfb-run -a uv run pytest -q -rs --no-header -p no:cacheprovider \
            --cov=netcross_gtk4 --cov-report=term --cov-report=xml:coverage-gtk4.xml --cov-fail-under=0 \
            | tee /tmp/gtk4.txt
          if grep -qE "pygobject absent|GTK4 absent|pas d'affichage pour GTK4" /tmp/gtk4.txt; then
            echo "::error::des tests GTK4 ont été sautés alors que ce job installe GTK4 et Xvfb"
            exit 1
          fi
          echo "tests GTK4 : tous exécutés"

      - name: Publication de la couverture GTK4 (artifact)
        # Issue #943 : la couverture de ce job n'était ni exportée ni
        # combinée avec celle du job Qualité — les ~3700 instructions des
        # modules netcross_gtk4 comptaient pour 0 % dans le total de la CI.
        # Renommage du .coverage (même raison que le job Qualité : sans
        # point initial, upload-artifact exclut les fichiers cachés) et
        # publication pour le job « Couverture combinée ».
        if: always()
        run: cp .coverage coverage-gtk4.dat || { echo "::warning::.coverage absent (mesure non exécutée)"; exit 0; }
      - name: Upload de la couverture GTK4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-gtk4
          path: |
            coverage-gtk4.dat
            coverage-gtk4.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Restituer le workspace au runner (chown)
        # Cf. job Qualité : conteneur root, fichiers root-owned sinon légués
        # aux jobs natifs du workspace partagé (#919/#936).
        if: always()
        run: |
          chown -R --reference="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          chown -R --reference="$RUNNER_TEMP" "$RUNNER_TEMP"

  couverture-combinee:
    # Issue #943 : le total de couverture de la CI ne voyait jamais le GUI.
    # Les jobs Qualité et GTK4 mesuraient chacun leur moitié (source vs
    # netcross_gtk4) sans jamais combiner : 88,1 % affichés alors que le
    # GUI est couvert par ses propres tests dans l'autre job. Ce job
    # télécharge les deux fichiers de données coverage.py, les combine
    # (coverage combine) et publie le total réel toutes sources confondues
    # dans le résumé du run. Seuil bloquant : fail_under de pyproject.toml
    # (95 %, audit #462, #953), appliqué au total réel (98,2 % mesuré le
    # 18/10/2026). Le job Qualité applique le même fail_under hors
    # netcross_gtk4 (--omit au rapport) : sans PyGObject, ces modules y
    # comptaient pour 0 %. Un seul chiffre, deux périmètres complémentaires.
    name: Couverture combinée (Qualité + GTK4)
    needs: [quality, gtk4]
    # Toujours exécuté : si un job amont échoue, c'est lui qui est rouge,
    # ce job se contente alors de le signaler dans le résumé.
    if: always()
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON || '"ubuntu-latest"') }}
    container:
      image: ubuntu:26.04
      options: --privileged

    steps:
      - name: Prérequis du conteneur (git, certificats, python3)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout du dépôt
        # Le rapport final affiche les lignes manquantes : les sources
        # doivent être présentes, aux mêmes chemins absolus que ceux
        # enregistrés dans les fichiers de données (même image, même
        # espace de travail → /__w/Netcross/Netcross).
        uses: actions/checkout@v7

      - name: Téléchargement des données de couverture
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: cov/

      - name: Installation de coverage.py
        # venv PEP 668 (ubuntu:26.04) ; version « >=7 » : combine exige
        # de lire les données produites par la même génération majeure.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH ne prend effet qu'à l'étape suivante : pip du venv
          # appelé par son chemin absolu ici.
          "$RUNNER_TEMP/venv/bin/pip" install 'coverage>=7'

      - name: Combinaison et rapport réel
        # Les données manquantes (job amont rouge avant pytest) ne font
        # pas échouer ce job : l'échec amont est déjà le signal.
        run: |
          if [ ! -f cov/coverage-qualite.dat ] || [ ! -f cov/coverage-gtk4.dat ]; then
            echo "::warning::données de couverture incomplètes (job Qualité ou GTK4 en échec avant la mesure) — pas de total combiné"
            echo "## Couverture combinée (issue #943)" >> "$GITHUB_STEP_SUMMARY"
            echo "Données incomplètes : le job Qualité ou GTK4 a échoué avant la mesure. Pas de total combiné." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          coverage combine cov/coverage-qualite.dat cov/coverage-gtk4.dat
          coverage report | tee /tmp/couverture.txt
          coverage xml -o coverage-combinee.xml

      - name: Total réel dans le résumé + seuil
        # fail_under vient de pyproject.toml ([tool.coverage.report],
        # lu automatiquement par coverage après le checkout).
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            exit 0
          fi
          pct=$(coverage json -o /tmp/total.json >/dev/null && \
            python3 -c "import json; print(f\"{json.load(open('/tmp/total.json'))['totals']['percent_covered']:.1f}\")")
          {
            echo "## Couverture combinée (Qualité + GTK4) — issue #943"
            echo
            echo "Total réel toutes sources confondues : **${pct} %**"
            echo
            echo "Seuil bloquant : \`fail_under\` de pyproject.toml (95 %, audit #462 et #953), appliqué à ce total réel."
            echo
            echo '```'
            cat /tmp/couverture.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          coverage report > /dev/null  # fail_under de pyproject.toml (#953)

      - name: Restituer le workspace au runner (chown)
        # Cf. job Qualité : conteneur root, fichiers root-owned sinon légués
        # aux jobs natifs du workspace partagé (#919/#936).
        if: always()
        run: |
          chown -R --reference="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          chown -R --reference="$RUNNER_TEMP" "$RUNNER_TEMP"

  types:
    # Verification statique des types (issue #281).
    # NON BLOQUANT pour l instant : continue-on-error = true.
    # Deviendra bloquant des que la baseline atteint 0 sur les modules
    # stricts (bascule : retirer continue-on-error + ajouter les modules
    # dans [[tool.mypy.overrides]] de pyproject.toml).
    name: Types (mypy)
    # Python seul : natif sur les runners maison (Ubuntu 20.04, Python par
    # uv), sans conteneur. Repli GitHub : variable NETCROSS_RUNS_ON_LEGER.
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON_LEGER || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:

      # Checkout isolé (même principe que le job Construction) : les jobs
      # en conteneur (--privileged, utilisateur root) laissent des fichiers
      # détenus par root dans le .git du workspace partagé du runner maison.
      # Ce job natif (utilisateur mathilde) ne peut ni les supprimer ni les
      # réécrire : checkout dans un sous-répertoire vierge, hors de ce .git.
      - name: Checkout du dépôt
        uses: actions/checkout@v7
        with:
          path: mypy

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install 3.14

      - name: Installation des dépendances (extras dev)
        run: uv sync --extra dev
        working-directory: mypy

      - name: Vérification des types (mypy)
        run: uv run mypy
        working-directory: mypy

  packaging:
    # Issue #342 : la casse du .deb (#336, sous-paquets et pcap_parser non
    # installes) est passee inapercue faute de job qui construise PUIS
    # installe le paquet. Ce job teste le paquet tel que l'utilisateur le
    # recoit : installation apt, --help de chaque lanceur, import de chaque
    # module avec /usr/bin/python3, analyse reelle d'une capture.
    name: Paquets (deb installé, rpm vérifié)
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON || '{"group":"maison","labels":["self-hosted","linux","docker"]}') }}
    container:
      image: ubuntu:26.04
      options: --privileged

    steps:
      - name: Prérequis du conteneur (git, certificats, compilateur)
        # ubuntu:26.04 est une image minimale : ni git (checkout et diff i18n),
        # ni certificats, ni gcc (roues pygobject/pycairo compilées localement),
        # ni python3 (scripts du dépôt), ni sudo (scripts/smoke-test-packages.sh).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl build-essential sudo python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Outils de construction (debhelper, rpm) et tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential debhelper dpkg-dev gettext rpm tshark

      - name: Construction du .deb
        run: ./build-deb/build.sh

      - name: Test de fumée du .deb installé
        run: ./scripts/smoke-test-packages.sh deb build-deb/dist/netcross_*_all.deb

      - name: Construction du .rpm
        run: ./build-rpm/build.sh

      - name: Vérification du contenu du .rpm
        run: ./scripts/smoke-test-packages.sh rpm build-rpm/dist/netcross-*.noarch.rpm

      - name: Publication des paquets (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: |
            build-deb/dist/*.deb
            build-rpm/dist/*.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Restituer le workspace au runner (chown)
        # Cf. job Qualité : conteneur root — ce job laisse précisément les
        # artefacts build-rpm/_build détenus par root qui ont empoisonné le
        # workspace (constat 22/10/2026, #919/#936).
        if: always()
        run: |
          chown -R --reference="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          chown -R --reference="$RUNNER_TEMP" "$RUNNER_TEMP"

  documentation:
    # Ex docs.yml (issue #282). Check requis par la protection de dev :
    # le nom du job doit rester « Construction (mkdocs build --strict) ».
    # Pas de if: -- check_branch_protection.py --hors-ligne ignore les jobs
    # conditionnels.
    # Checkout isolé : les jobs en conteneur (--privileged, utilisateur
    # root) laissent des fichiers détenus par root dans le .git du workspace
    # partagé du runner maison ; ce job natif (utilisateur mathilde) ne peut
    # ni les supprimer ni les réécrire. Checkout dans un sous-répertoire
    # vierge, hors de ce .git (même principe que le job Types).
    name: Construction (mkdocs build --strict)
    # Python seul : natif sur les runners maison (Ubuntu 20.04, Python par
    # uv), sans conteneur. Repli GitHub : variable NETCROSS_RUNS_ON_LEGER.
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON_LEGER || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:

      - name: Checkout du dépôt
        uses: actions/checkout@v7
        with:
          path: mkdocs

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python 3.14 (uv)
        # Python système trop ancien sur les runners maison (3.8) : venv uv.
        # Nom unique (--clear en plus) : sur un runner auto-hébergé,
        # $RUNNER_TEMP est partagé entre les jobs — le venv laissé par un
        # job en conteneur (root, ex. Couverture) y bloque sinon le nôtre
        # (« A virtual environment already exists », #919).
        run: |
          uv venv --clear --python 3.14 --seed "$RUNNER_TEMP/venv-mkdocs"
          echo "$RUNNER_TEMP/venv-mkdocs/bin" >> "$GITHUB_PATH"

      - name: Installation de mkdocs-material
        run: pip install mkdocs-material pymdown-extensions

      - name: Construction (strict -- échoue sur lien mort)
        run: mkdocs build --strict
        working-directory: mkdocs

      - name: Upload de l'artefact (site HTML)
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: mkdocs/site/

  i18n:
    # Ex i18n.yml check (issue #299). Vérifie que les catalogues de traduction
    # gettext sont à jour avec les sources, valides et compilables.
    # Non requis par la protection de dev : peut avoir un if: de filtre, mais
    # les fichiers concernés (src/**/*.py, lang/**) couvrent la majeure partie
    # du code, donc le job tourne sur toutes les PR/push.
    name: i18n (catalogues à jour)
    runs-on: ${{ fromJSON(vars.NETCROSS_RUNS_ON || '{"group":"maison","labels":["self-hosted","linux","docker"]}') }}
    container:
      image: ubuntu:26.04
      options: --privileged

    steps:
      - name: Prérequis du conteneur (git, certificats, compilateur)
        # ubuntu:26.04 est une image minimale : ni git (checkout et diff i18n),
        # ni certificats, ni gcc (roues pygobject/pycairo compilées localement),
        # ni python3 (scripts du dépôt), ni sudo (scripts/smoke-test-packages.sh).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl build-essential sudo python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout du dépôt (historique complet pour le diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installation de Python 3.14 (paquet Ubuntu 26.04)
        # setup-python ne publie pas de build pour ubuntu 26.04 : Python du
        # système dans un venv (PEP 668 interdit pip hors venv).
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Installer gettext
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gettext

      - name: Catalogues à jour et valides
        id: sync
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: ./scripts/i18n-update.sh --check

      - name: Compilation de toutes les locales
        run: ./scripts/i18n-update.sh --compile "$RUNNER_TEMP/locale"

      - name: Résumé
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          since=()
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then since=(--since "$BASE"); fi
          python3 scripts/i18n_report.py --compiled "$RUNNER_TEMP/locale" "${since[@]}"
          python3 scripts/i18n_report.py --markdown --compiled "$RUNNER_TEMP/locale" "${since[@]}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/i18n_report.py --strict > /dev/null

      - name: Catalogues désynchronisés
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::catalogues à régénérer -- le job update ouvre la PR de mise à jour"

      - name: Restituer le workspace au runner (chown)
        # Cf. job Qualité : conteneur root, fichiers root-owned sinon légués
        # aux jobs natifs du workspace partagé (#919/#936).
        if: always()
        run: |
          chown -R --reference="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          chown -R --reference="$RUNNER_TEMP" "$RUNNER_TEMP"
